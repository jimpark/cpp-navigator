[package]
name = "cpp-navigator"
version = "0.1.0"
edition = "2024"
description = "LLM-optimized C++ codebase navigator CLI"
license = "MIT OR Apache-2.0"
default-run = "cpp-navigator"

[features]
# Default build is fully self-contained (tree-sitter + embedded ripgrep crates).
default = []
# Opt-in Stage 2 precision backend. Links a system libclang; NOT self-contained.
semantic = ["dep:clang"]

[lib]
name = "cpp_navigator"
path = "src/lib.rs"

[[bin]]
name = "cpp-navigator"
path = "src/main.rs"

# Short human alias; same engine, thin wrapper.
[[bin]]
name = "cppnav"
path = "src/bin/cppnav.rs"

[dependencies]
anyhow = "1.0.100"
clang = { version = "2.0.0", optional = true }
clap = { version = "4.5.52", features = ["derive"] }
grep = "0.3.2"
ignore = "0.4.23"
rayon = "1.11.1"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tree-sitter = "0.25.10"
tree-sitter-cpp = "0.23.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
